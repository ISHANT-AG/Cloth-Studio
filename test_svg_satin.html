<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; padding: 0; background: #350300; overflow: hidden; }
  svg { width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Base Gradient -->
    <radialGradient id="baseGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#E83D0E"/>
      <stop offset="35%" stop-color="#B81E00"/>
      <stop offset="70%" stop-color="#6E0B00"/>
      <stop offset="100%" stop-color="#320200"/>
    </radialGradient>

    <!-- Deep Crimson Satin Fold 1 -->
    <linearGradient id="deepFoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DE320A"/>
      <stop offset="35%" stop-color="#9C1300"/>
      <stop offset="70%" stop-color="#550700"/>
      <stop offset="100%" stop-color="#240200"/>
    </linearGradient>

    <!-- Vivid Fiery Orange Ribbon -->
    <linearGradient id="vividOrangeGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FFA638"/>
      <stop offset="25%" stop-color="#FF6B14"/>
      <stop offset="60%" stop-color="#DE3008"/>
      <stop offset="85%" stop-color="#8C1000"/>
      <stop offset="100%" stop-color="#460400"/>
    </linearGradient>

    <!-- Warm Amber Golden Ribbon -->
    <linearGradient id="amberGoldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFC05A"/>
      <stop offset="30%" stop-color="#FF7A1A"/>
      <stop offset="65%" stop-color="#CF2805"/>
      <stop offset="100%" stop-color="#5A0800"/>
    </linearGradient>

    <!-- Vermilion Swoop Gradient -->
    <linearGradient id="vermilionGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8426"/>
      <stop offset="35%" stop-color="#E6380A"/>
      <stop offset="70%" stop-color="#991400"/>
      <stop offset="100%" stop-color="#3F0400"/>
    </linearGradient>

    <!-- Golden Highlight Trim 1 -->
    <linearGradient id="goldRimGleam1" x1="0%" y1="0%" x2="100%" y2="30%">
      <stop offset="0%" stop-color="#FFF8E7" stop-opacity="0.95"/>
      <stop offset="20%" stop-color="#FFCC66" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#FF7818" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#B01D00" stop-opacity="0"/>
    </linearGradient>

    <!-- Golden Highlight Trim 2 -->
    <linearGradient id="goldRimGleam2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF2D0" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#FFBA42" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#E03A08" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#730C00" stop-opacity="0"/>
    </linearGradient>

    <!-- Volumetric Satin Shadows -->
    <filter id="satinShadowDeep" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-12" dy="28" stdDeviation="32" flood-color="#1A0100" flood-opacity="0.8"/>
    </filter>
    <filter id="satinShadowMid" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-8" dy="20" stdDeviation="22" flood-color="#1E0200" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Deep Base Canvas -->
  <rect width="100%" height="100%" fill="url(#baseGlow)"/>

  <!-- Wave 1: Bottom Right Swell -->
  <path d="M700,1080 C1000,820 1450,920 1920,720 L1920,1080 Z"
        fill="url(#deepFoldGrad)"/>

  <!-- Wave 2: Bottom-Left to Center-Right Sweeping Billow -->
  <g filter="url(#satinShadowDeep)">
    <path d="M-100,880 C280,620 680,820 1180,680 C1620,540 1820,780 2050,640 L2050,1180 L-100,1180 Z"
          fill="url(#vividOrangeGrad)"/>
    <path d="M-100,880 C280,620 680,820 1180,680 C1620,540 1820,780 2050,640"
          stroke="url(#goldRimGleam1)" stroke-width="4.5" fill="none"/>
  </g>

  <!-- Wave 3: Bottom Left Dramatic Satin Fold -->
  <g filter="url(#satinShadowDeep)">
    <path d="M-150,1080 C50,750 380,820 720,1080 Z"
          fill="url(#amberGoldGrad)"/>
    <path d="M-150,1080 C50,750 380,820 720,1080"
          stroke="url(#goldRimGleam2)" stroke-width="4" fill="none"/>
  </g>

  <!-- Wave 4: Central Flowing Satin Ribbon across the Viewport -->
  <g filter="url(#satinShadowDeep)">
    <path d="M-120,440 C320,240 760,540 1280,340 C1740,160 1880,420 2150,310 L2150,1180 L-120,1180 Z"
          fill="url(#vividOrangeGrad)"/>
    <path d="M-120,440 C320,240 760,540 1280,340 C1740,160 1880,420 2150,310"
          stroke="url(#goldRimGleam1)" stroke-width="5" fill="none"/>
  </g>

  <!-- Wave 5: Upper-Left Cascading Ribbon Swoop -->
  <g filter="url(#satinShadowMid)">
    <path d="M-100,160 C380,10 780,260 1260,120 C1740,-20 1860,190 2100,90 L2100,600 C1820,480 1480,580 1100,480 C740,380 340,510 -100,320 Z"
          fill="url(#vermilionGrad)"/>
    <path d="M-100,160 C380,10 780,260 1260,120 C1740,-20 1860,190 2100,90"
          stroke="url(#goldRimGleam2)" stroke-width="4" fill="none"/>
  </g>

  <!-- Wave 6: Top Cresting Golden Silk Drape -->
  <g filter="url(#satinShadowMid)">
    <path d="M-60,-30 C340,-130 760,90 1240,-40 C1680,-160 1880,60 2060,-10 L2060,320 C1780,220 1420,340 1080,240 C720,140 320,280 -60,120 Z"
          fill="url(#amberGoldGrad)" opacity="0.92"/>
    <path d="M-60,-30 C340,-130 760,90 1240,-40 C1680,-160 1880,60 2060,-10"
          stroke="url(#goldRimGleam1)" stroke-width="4.5" fill="none"/>
  </g>

  <!-- Wave 7: Right Side Edge Accent Curl -->
  <path d="M1500,-50 C1680,180 1780,450 1920,550 L1920,-50 Z"
        fill="url(#deepFoldGrad)" opacity="0.6"/>
</svg>
</body>
</html>
